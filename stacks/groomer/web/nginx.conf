# groomer-web nginx: SPA history fallback + proxy /api -> the groomer api service.
#
# The api service runs the vet-api binary. 41874 is the binary's DEFAULT port, but the groomer
# compose file sets `PORT: "43618"` (and its healthcheck probes 43618), so inside the compose
# network the api listens on 43618 and nothing answers on 41874 — every `/api` call in a deployed
# groomer stack was refused at the proxy. The published `.ics` feed rides the same `/api` path, so
# this had to be right for a calendar client to reach it.
#
# The trailing slash on `proxy_pass` is what strips the `/api` prefix, matching the dev server's
# `rewrite: p => p.replace(/^\/api/, "")` in vite.config.ts — the two must agree or a URL that works
# in dev 404s in production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The published calendar feed. Its URL PATH SEGMENT is the credential — a calendar client cannot
    # send a bearer token, so the secret has nowhere else to live (see stacks/vet/api/src/calendar_ics.rs).
    # nginx's default access_log records the full request URI, so without this every subscriber poll
    # would write that secret to the log in plaintext, on the provider's polling schedule, forever.
    # The application itself never logs it; this is the proxy holding up its half.
    #
    # The pattern matches a feed READ and nothing else. A live token is exactly 64 lowercase hex
    # characters (`mint_token` hex-encodes 32 CSPRNG bytes), optionally suffixed `.ics`. So
    # `POST /api/calendar/feed/rotate`, `GET /api/calendar/feed` and every other admin call keep
    # normal logging — as does any request whose token is the WRONG shape, which is correct: that URI
    # carries no valid credential, so recording it costs nothing and leaves a probe signal here. Only
    # a well-formed token goes unlogged, and that is exactly the string worth not writing down.
    #
    # Anything in FRONT of this proxy — the Cloudflare tunnel, a CDN, a load balancer — records the
    # full URI by default and is configured elsewhere. This narrows the exposure; it does not close
    # it. Rotation is the mitigation.
    #
    # A regex location takes precedence over the `location /api/` prefix match below regardless of
    # order, and the pattern is QUOTED because nginx's parser would otherwise read `{64}` as a block.
    # proxy_pass in a regex location may carry no URI part, so the `/api` prefix is stripped by
    # rewrite instead of by a trailing slash — a variable in proxy_pass would switch nginx to runtime
    # name resolution and need a `resolver`, which Compose DNS does not provide here.
    location ~ "^/api/calendar/feed/[0-9a-f]{64}(\.ics)?$" {
        access_log off;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api:43618;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The PUBLIC per-appointment client handoff: the page a client scans off a QR, and the `.ics`
    # their phone opens into its calendar. Owned by the BACKEND, not this SPA. A deployment may point
    # DEPLOYMENT_URL at the API directly or at this portal's origin; these two blocks are what make
    # the second choice work.
    #
    # THE PREFIX BLOCK BELOW IS WHAT CLOSES THE HOLE, and it is the load-bearing one: EVERYTHING
    # under `/a/` must reach the backend, not just a well-formed token. Without it the `location /`
    # history fallback above answers a scanning phone with the operator app's index.html — a 200 from
    # a live host serving entirely the wrong thing, which reads as working far more convincingly than
    # a dead link. A token arrives truncated, upper-cased, or with punctuation a messaging app glued
    # on far more often than it arrives perfect, and every one of those shapes has to meet the
    # backend's own honest 404 rather than the operator SPA. This also matches the dev server, whose
    # `/a/` proxy in vite.config.ts is a plain prefix and forwards every shape.
    #
    # The regex block exists ONLY to suppress logging of a LIVE token, and nothing else depends on
    # it: nginx prefers a matching regex location over a prefix location regardless of order, so a
    # well-formed token lands there and keeps `access_log off` while every other shape falls through
    # to the prefix block. That suppression matters because the token is a URL PATH SEGMENT and
    # nginx's default access_log records the full request URI, so every scan would otherwise write
    # the credential to the log in plaintext. A live token is exactly 32 lowercase hex characters
    # (16 CSPRNG bytes, hex), optionally suffixed `.ics`. A token of the WRONG shape deliberately
    # keeps normal logging: it carries no valid credential, so recording it costs nothing and leaves
    # the probe signal here.
    #
    # This handoff names ONE appointment, so the blast radius of a leaked line is one booking rather
    # than the shop's whole schedule — but a CDN or tunnel in FRONT of this proxy still records the
    # full URI by default and is configured elsewhere. This narrows the exposure; it does not close
    # it. The pattern is quoted because nginx's parser would otherwise read `{32}` as a block. No
    # `rewrite` in either block, because the backend route is `/a/:token` with no prefix to strip —
    # and for the same reason both `proxy_pass` targets carry no trailing slash and no URI part,
    # which would make nginx strip the matched `/a/` and stop the upstream route matching.
    location ~ "^/a/[0-9a-f]{32}(\.ics)?$" {
        access_log off;
        proxy_pass http://api:43618;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every other `/a/` shape. Deliberately WITH access logging — see above. The trailing slash on
    # the location is required: a bare `location /a` would also prefix-match `/appointments`, a real
    # operator SPA route, and proxy it away from the app.
    location /a/ {
        proxy_pass http://api:43618;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:43618/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
