# vet-web nginx: serve the SPA with history-API fallback and proxy /api -> the api service
# (compose-internal DNS name `api`, listening on 41874). The browser only ever talks to web:80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The published calendar feed. `ics_feed_router` is merged into `public_router` for every role, so
    # a vet stack serves `GET /calendar/feed/{token}.ics` too and carries the same exposure the
    # groomer does: the token in the PATH is the credential (a calendar client cannot send a bearer
    # token), and nginx's default access_log records the full request URI — so a subscriber poll would
    # write that secret to the log in plaintext. Suppressed for a feed READ only: a live token is 64
    # lowercase hex characters (`mint_token`), optionally `.ics`-suffixed. `/calendar/feed/rotate` and
    # any wrong-shaped token carry no valid credential and keep normal logging, which is where the
    # probe signal stays. A tunnel, CDN or load balancer in front still logs the URI by default and is
    # outside this file — rotation is the mitigation.
    #
    # Same shape as stacks/groomer/web/nginx.conf; only the upstream port differs. Quoted because
    # nginx's parser would read `{64}` as a block, and `rewrite` strips the `/api` prefix because
    # proxy_pass in a regex location may carry no URI part (the trailing slash does it below).
    location ~ "^/api/calendar/feed/[0-9a-f]{64}(\.ics)?$" {
        access_log off;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api:41874;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The PUBLIC per-appointment client handoff (page + `.ics`). Mounted for EVERY role — a vet books
    # appointments too — so it is proxied here for the same reason the feed above is.
    #
    # THE PREFIX BLOCK BELOW IS WHAT CLOSES THE HOLE: everything under `/a/` must reach the backend,
    # not just a well-formed token. Without it the `location /` history fallback answers a scanning
    # phone with this SPA's index.html — a 200 from a live host serving the wrong thing, which reads
    # as working more convincingly than a dead link — and it would do so for exactly the shapes that
    # arrive in practice: truncated, upper-cased, or with punctuation a messaging app glued on. The
    # dev server's `/a/` proxy in vite.config.ts is a plain prefix and forwards every shape; this is
    # what makes production agree with it.
    #
    # The regex block exists ONLY to suppress logging of a LIVE token: nginx prefers a matching regex
    # location over a prefix location regardless of order, so a well-formed token (32 lowercase hex,
    # optionally `.ics`) lands there and keeps `access_log off`, exactly as for the feed, while every
    # other shape falls through to the prefix block and keeps normal logging — which is correct, as
    # it carries no valid credential and leaves the probe signal.
    #
    # Same shape as stacks/groomer/web/nginx.conf; only the upstream port differs. No `rewrite` in
    # either block because the backend route is `/a/:token` with no prefix to strip — and for the
    # same reason neither `proxy_pass` carries a trailing slash or URI part, which would make nginx
    # strip the matched `/a/` and stop the upstream route matching.
    location ~ "^/a/[0-9a-f]{32}(\.ics)?$" {
        access_log off;
        proxy_pass http://api:41874;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every other `/a/` shape. Deliberately WITH access logging — see above. The trailing slash on
    # the location is required: a bare `location /a` would also prefix-match `/appointments`, a real
    # operator SPA route, and proxy it away from the app.
    location /a/ {
        proxy_pass http://api:41874;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API reverse-proxy (strip the /api prefix to match the Rust routes).
    location /api/ {
        proxy_pass http://api:41874/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
