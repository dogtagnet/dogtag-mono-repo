# vet-web nginx: serve the SPA with history-API fallback and proxy /api -> the api service
# (compose-internal DNS name `api`, listening on 41874). The browser only ever talks to web:80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The published calendar feed. `ics_feed_router` is merged into `public_router` for every role, so
    # a vet stack serves `GET /calendar/feed/{token}.ics` too and carries the same exposure the
    # groomer does: the token in the PATH is the credential (a calendar client cannot send a bearer
    # token), and nginx's default access_log records the full request URI — so a subscriber poll would
    # write that secret to the log in plaintext. Suppressed for a feed READ only: a live token is 64
    # lowercase hex characters (`mint_token`), optionally `.ics`-suffixed. `/calendar/feed/rotate` and
    # any wrong-shaped token carry no valid credential and keep normal logging, which is where the
    # probe signal stays. A tunnel, CDN or load balancer in front still logs the URI by default and is
    # outside this file — rotation is the mitigation.
    #
    # Same shape as stacks/groomer/web/nginx.conf; only the upstream port differs. Quoted because
    # nginx's parser would read `{64}` as a block, and `rewrite` strips the `/api` prefix because
    # proxy_pass in a regex location may carry no URI part (the trailing slash does it below).
    location ~ "^/api/calendar/feed/[0-9a-f]{64}(\.ics)?$" {
        access_log off;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api:41874;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API reverse-proxy (strip the /api prefix to match the Rust routes).
    location /api/ {
        proxy_pass http://api:41874/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
