# DogTag iOS — Nearby discloses its server request before permission and never exposes the
# retired chosen-location/map flow.
#
# Prerequisites: DEBUG app installed, a reachable indexer with the paged provider endpoints, and a
# simulator location set immediately before the run:
#   xcrun simctl location <udid> set 1.2931,103.8520
#   maestro test apps/ios/maestro/nearby_scope_separation.yaml
#
# ONLY THE FIRST HALF OF THIS FLOW RUNS ON A DEV MACHINE. Read a local failure accordingly rather
# than as a product regression, and never as a silent pass:
#
#   Runs locally (needs no directory read): everything up to and including the "Directions" absence -
#   the "How your location is used" card, the disclosure sentence, the approximation/rounding
#   absences, and the retired chosen-location surfaces.
#
#   Requires a reachable deployment at `AppConfig.centralApi` (`https://api.dogtag.io`): everything
#   below the divider. The app's directory host is a fixed production constant with no debug
#   override - deliberately, since it is the one service the owner cannot swap - so a dev machine
#   cannot reach a live directory, every read fails closed, and no result row is ever rendered. Those
#   assertions are still the specification; count them as deployment/manual-QA coverage, and never as
#   coverage a local run delivered.
#   Note the three trailing absence assertions are VACUOUS without a deployment too: an absence
#   passes just as happily when the contacts list rendered nothing at all, and its disclaimer line is
#   emitted only in the `.providersFound` case (`NearbyScreen.swift`).
appId: io.liberalize.dogtag
---
- launchApp:
    clearState: true
- tapOn: "Nearby"
- extendedWaitUntil:
    visible: "How your location is used"
    timeout: 20000

# The disclosure is visible at the action that triggers the OS grant, before it can be tapped.
- assertVisible:
    text: "Your location is sent to DogTag to find nearby vets and groomers. It is not stored."

# No surface may claim an approximation or an on-device rounding the app does not perform.
- assertNotVisible: "Approximate location only"
- assertNotVisible:
    text: ".*rounded on this phone.*"
- assertNotVisible:
    text: ".*three decimal places.*"
- assertVisible: "Use my current location"
- assertNotVisible: "Chosen location"
- assertNotVisible: "Latitude"
- assertNotVisible: "Longitude"
# Directions is a per-ROW affordance, so it is absent until a provider row exists. It is asserted
# PRESENT on a nearby row below. This is not the retired map flow: it hands the provider's public
# destination to another app and never the owner's origin.
- assertNotVisible: "Directions"

# ---- everything below here needs a reachable directory at AppConfig.centralApi (see the header) ----
- tapOn: "Use my current location"
- extendedWaitUntil:
    visible:
      text: ".*[~<] ?[0-9.]+ ?(km|m|mi|ft).*"
    timeout: 30000

# A ranked row offers the maps handoff. Unlike the absence assertions, this one cannot pass
# vacuously: it is reached only after a row carrying a server distance has rendered.
- assertVisible: "Directions"

# Server distance is visible only in Nearby. The position-free contact/name request cannot inherit it.
- tapOn: "Provider contacts"
- extendedWaitUntil:
    visible: ".*This list sends no position and shows no map.*"
    timeout: 15000
- assertNotVisible:
    text: ".*[~<] ?[0-9.]+ ?(km|m|mi|ft).*"
# Scope separation, not a global absence: the handoff lives on the proximity surface only, so this
# list keeps its "sends no position and shows no map" promise whole.
- assertNotVisible: "Directions"
- assertNotVisible: "Chosen location"
