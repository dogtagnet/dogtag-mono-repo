# DogTag iOS — Nearby discloses its server request before permission and never exposes the
# retired chosen-location/map flow.
#
# Prerequisites: a DEBUG app installed. NOTHING ELSE - every assertion here is reached before any
# directory read, so this flow runs and PASSES on a plain dev machine:
#   scripts/e2e-ios.sh --flow apps/ios/maestro/nearby_scope_separation.yaml
#
# THE DEPLOYMENT-DEPENDENT HALF WAS SPLIT OUT into `nearby_result_rows.yaml`. It used to live below a
# divider in this file, and the consequence was that a local run of the half that CAN run always went
# red on the half that cannot - a "could not run" wearing the costume of a failure. A red nobody can
# act on is a red everybody learns to ignore, which costs the runnable assertions here their value.
#
# What that file covers, and why it needs a real deployment: the rendered result rows, their distance
# labels, and the absence of those labels in the position-free contacts search. The directory host is
# the fixed production constant `AppConfig.centralApi` with no debug override, so a dev machine
# cannot reach it. Those assertions are still the specification - count them as deployment/manual-QA
# coverage, and never as coverage a local run delivered.
appId: io.liberalize.dogtag
---
- launchApp:
    clearState: true
- tapOn: "Nearby"
- extendedWaitUntil:
    visible: "How your location is used"
    timeout: 20000

# The disclosure is visible at the action that triggers the OS grant, before it can be tapped.
- assertVisible:
    text: "Your location is sent to DogTag to find nearby vets and groomers. It is not stored."

# No surface may claim an approximation or an on-device rounding the app does not perform.
- assertNotVisible: "Approximate location only"
- assertNotVisible:
    text: ".*rounded on this phone.*"
- assertNotVisible:
    text: ".*three decimal places.*"
- assertVisible: "Use my current location"
- assertNotVisible: "Chosen location"
- assertNotVisible: "Latitude"
- assertNotVisible: "Longitude"
# Directions is a per-ROW affordance, so it is absent until a provider row exists. That it is
# PRESENT on a ranked row is asserted in `nearby_result_rows.yaml`, which needs a deployment - so
# read this absence as "no row has rendered yet", never as "the handoff is gone". It is not the
# retired map flow: it hands the provider's public destination to another app, never the owner's origin.
- assertNotVisible: "Directions"
