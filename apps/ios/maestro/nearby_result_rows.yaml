# DogTag iOS - Nearby RESULT ROWS: server distance is scoped to Nearby and never leaks into the
# position-free contacts search.
#
# THIS FLOW CANNOT RUN ON A DEV MACHINE, AND THAT IS A DELIBERATE PRODUCT PROPERTY.
#
# The app's directory host is the FIXED production constant `AppConfig.centralApi`
# (`https://api.dogtag.io`) with no debug override - deliberately, because it is the one service the
# owner cannot swap, and a build-time or debug host override added so a Maestro flow could reach a
# local instance would weaken that property for test convenience. So a dev machine cannot reach a
# live directory, every read fails closed, and no result row is ever rendered.
#
# It was SPLIT OUT of `nearby_scope_separation.yaml`, whose header already said only its first half
# runs locally. Sharing one file meant a local run of the runnable half always went red on this half,
# which is a "could not run" wearing the costume of a failure - and a red nobody can act on is a red
# everybody learns to ignore. The tag below keeps it out of the default set, and
# `scripts/e2e-ios.sh` PRINTS what it excluded rather than dropping it silently.
#
# Run it against a real deployment with:
#   xcrun simctl location <udid> set 1.2931,103.8520
#   scripts/e2e-ios.sh --include-deployment
#
# THE THREE TRAILING ABSENCE ASSERTIONS ARE VACUOUS WITHOUT A DEPLOYMENT, which is the other half of
# why this cannot simply be left in the default set: an absence passes just as happily when the
# contacts list rendered nothing at all, and its disclaimer line is emitted only in the
# `.providersFound` case (`NearbyScreen.swift`). A green here without a directory would be a lie.
appId: io.liberalize.dogtag
tags:
  - requires-deployment
---
- launchApp:
    clearState: true
- tapOn: "Nearby"
- extendedWaitUntil:
    visible: "How your location is used"
    timeout: 20000

- tapOn: "Use my current location"
- extendedWaitUntil:
    visible:
      text: ".*[~<] ?[0-9.]+ ?(km|m|mi|ft).*"
    timeout: 30000

# A ranked row offers the maps handoff. Unlike the absence assertions, this one cannot pass
# vacuously: it is reached only after a row carrying a server distance has rendered.
- assertVisible: "Directions"

# Server distance is visible only in Nearby. The position-free contact/name request cannot inherit it.
- tapOn: "Provider contacts"
- extendedWaitUntil:
    visible: ".*This list sends no position and shows no map.*"
    timeout: 15000
- assertNotVisible:
    text: ".*[~<] ?[0-9.]+ ?(km|m|mi|ft).*"
# Scope separation, not a global absence. The handoff is offered on nearby rows and on OFFLINE
# STORED rows (captain's ruling, 2026-07-30), but NOT on this live contacts search, whose own copy
# promises it sends no position and shows no map. The stored case shares this row component and is
# told apart by `storedRecord`; it is unreachable from a dev machine, so it is manual-QA coverage.
- assertNotVisible: "Directions"
- assertNotVisible: "Chosen location"
