name: DogTag
options:
  bundleIdPrefix: io.liberalize
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # The xcframework headers ship a module.modulemap; nothing else to set globally.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Automatic signing with the signed-in Apple Developer team (Zhenhao Wu).
    DEVELOPMENT_TEAM: AYDBUX9433
    CODE_SIGN_STYLE: Automatic

targets:
  DogTag:
    type: application
    platform: iOS
    sources:
      - path: DogTag
    dependencies:
      - framework: DogTagFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.liberalize.dogtag
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "DogTag scans verifier QR codes to sign verification consents."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "DogTag uses Face ID to protect your embedded wallet and authorize consent signing."
        # Must stay byte-identical to NearbyDecision.locationDisclosure. This is the sentence the owner
        # reads at the moment they decide to hand over their location, so it may not claim a rounding
        # or an approximation the app does not perform: the exact fix is sent (captain, 2026-07-30).
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is sent to DogTag to find nearby vets and groomers. It is not stored."
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        # The static lib has no embedded bitcode and is a plain archive; link directly.
        OTHER_LDFLAGS: -ObjC
        TARGETED_DEVICE_FAMILY: "1"

  # Pure-logic unit tests. This bundle deliberately has NO host application and NO dependency on
  # DogTagFFI.xcframework: it compiles the handful of self-contained sources it covers (currently
  # QrPayload.swift, PublicSignalIndex.swift, and ZkeyAsset.swift, all importing only Foundation, or
  # nothing at all) straight into the test binary. That keeps `xcodebuild test` runnable on a plain
  # checkout, where
  # the xcframework is gitignored and absent until someone builds the Rust core. Adding a source here
  # that pulls in FFI would break that.
  DogTagTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DogTagTests
      - path: DogTag/QrPayload.swift
      - path: DogTag/PublicSignalIndex.swift
      # ZkeyAsset's descriptor/registry/resolve are pure (Foundation only); only ensure()/ensureGraph()
      # touch Bundle.main, and the tests never call those. Safe to compile into the host-less bundle.
      - path: DogTag/ZkeyAsset.swift
      # AnchorResolver is Foundation-only (the two pure ABI decoders); the FFI glue
      # that builds a TrustedAnchor + calls validateDiscovery lives in ScanScreen, not here.
      - path: DogTag/AnchorResolver.swift
      # The issuer↔domain binding model + copy is Foundation-only by design (its only network use is via
      # Net/Http, which are themselves Foundation-only), so the three-state DNS classification and the
      # copy discipline are covered here rather than only by inspection.
      # (Keccak256 already comes along below via Wallet's link-time closure.)
      - path: DogTag/IssuerDomainBinding.swift
      # Net carries the directory SOURCE adapter plus the file-backed cache store. Both are
      # Foundation-only; the store's own I/O is not exercised here, but compiling it keeps the
      # `ProviderDirectoryCacheStore` conformance and `ProviderDirectories.central()` honest.
      - path: DogTag/Net.swift
      # Models is Foundation-only (JSONSerialization) and carries `rootCoveredIssuerLeaf`, which the DID
      # assertion reads. SwiftUI lives in the screens, not here.
      - path: DogTag/Models.swift
      # The persisted user-selected CHAIN endpoint is Foundation-only. Keep it in this host-less target
      # so URL validation and UserDefaults persistence are covered without the app/FFI.
      - path: DogTag/RpcEndpointSettings.swift
      # NearbyDecision is the Foundation-only provider eligibility, state and claim policy shared by
      # NearbyScreen and its mirrored native tests. Core Location stays in NearbyScreen, outside this
      # host-less target; tests inject distance values.
      - path: DogTag/NearbyDecision.swift
      # VerdictDisplay is Foundation-only: the pure badge decision (staleness + expiry ordering) with an
      # injected clock and no SwiftUI, no JSON, no FFI. #94 filed extracting it precisely so this bundle
      # could pin the verdict rules the way RoaxRpcSelectorTest pins Android; Models.swift above already
      # depends on it, so it must be here regardless.
      - path: DogTag/VerdictDisplay.swift
      # ExportAvailability is Foundation-only: the pure decision behind the export panel's
      # "Approve & export" control — whether it may fire, and WHY not when it may not. Extracted so
      # this bundle can pin the no-silent-refusal invariant (a blocked state must carry a reason),
      # which is exactly what the previous shape could not satisfy: its only explanation lived inside
      # the action a disabled control never fires.
      - path: DogTag/ExportAvailability.swift
      # ConsentOutcome is Foundation-only: the terminal result of presenting a credential, carrying
      # the plain-language copy for the three kinds a holder must tell apart — it worked, DogTag
      # refused (deliberately, nothing shared), and we could not complete the check. Extracted so this
      # bundle pins the copy rules; the previous shape rendered a SECURITY REFUSAL as 12pt muted text
      # and the holder read it as nothing having happened.
      - path: DogTag/ConsentOutcome.swift
      # DogTagCard is Foundation-only: the pure fold behind the Profile screen's Dog-tags card - which
      # sources contributed a tag, and the "answered / could-not-read / not-yet-asked" distinction that
      # decides whether the card may claim there is no tag. Deliberately projects OwnedTag/ImportedTag
      # rather than depending on ProfileTreeStore.OwnerSecretRecord or LocalStore, both of which would
      # drag the FFI into this host-less bundle. Mirrors Android's DogTagCard.kt case for case.
      - path: DogTag/DogTagCard.swift
      # LocalDataSweep is Foundation-only by design so the destructive reset actions' file removal
      # (staging-sibling sweep, idempotence, partial-failure reporting) is covered here; the callers
      # that pull in Keychain/FFI/SwiftUI live in AppReset and the stores.
      - path: DogTag/LocalDataSweep.swift
      # Wallet.swift for its SeedBackup gate (UserDefaults + CryptoKit) and Bip39 (pure) - the
      # correctness the legacy-wallet rescue turns on. Its imports are Foundation/CryptoKit/Security/
      # LocalAuthentication, no FFI, so it compiles into this host-less bundle; Secp256k1 -> BigUInt/
      # Keccak256 and Wordlist come along as its link-time closure. The tests never call the Keychain
      # paths (no host app means no keychain entitlement) or evaluate LAContext - see
      # SeedBackupGateTests for why.
      - path: DogTag/Wallet.swift
      - path: DogTag/Secp256k1.swift
      - path: DogTag/BigUInt.swift
      - path: DogTag/Keccak256.swift
      - path: DogTag/Wordlist.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.liberalize.dogtag.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  DogTag:
    build:
      targets:
        DogTag: all
    run:
      config: Debug
  DogTagTests:
    build:
      targets:
        DogTagTests: [test]
    test:
      config: Debug
      targets:
        - DogTagTests
