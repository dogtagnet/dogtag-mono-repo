[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "paris"          # §13.1 M-4: consistent until ROAX PUSH0 confirmed
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "test/consent-fixture.json" },
    { access = "read", path = "test/device-profile-root.json" },
    # NOTE: the live address ledger needs NO read entry here - the directory-level `deployments` grant
    # below already covers it, and a narrower `deployments/roax.json` entry ABOVE that one would win
    # under first-match resolution and silently downgrade the ledger to read-only, breaking Deploy.s.sol
    # which WRITES it. No test drives that write, so the regression would be invisible until a real deploy.
    { access = "read", path = "src" },
    { access = "read", path = "out" },
    # ProtocolRegistry pin-verification test hashes the committed proving artifacts (M7 P3).
    { access = "read", path = "../circuits/build" },
    { access = "read-write", path = "deployments" },
]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "poseidon-solidity/=lib/poseidon-solidity/",
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
roax = "${ROAX_RPC}"
