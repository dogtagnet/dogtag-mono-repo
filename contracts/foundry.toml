[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "paris"          # §13.1 M-4: consistent until ROAX PUSH0 confirmed
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "test/consent-fixture.json" },
    { access = "read", path = "test/device-profile-root.json" },
    # S-12 cutover rehearsal: the derived historical-root inventory. The live address ledger needs
    # NO entry here - the directory-level `deployments` grant below already covers reading it, and a
    # narrower `deployments/roax.json` entry ABOVE that one would win under first-match resolution
    # and silently downgrade the ledger to read-only, breaking every script that WRITES it
    # (Deploy.s.sol, DeployCustodialIssuance.s.sol, DeployIssuerDomainRegistry.s.sol). No test drives
    # those writes, so that regression would be invisible until a real deploy.
    { access = "read", path = "rehearsal/fixtures" },
    { access = "read", path = "src" },
    { access = "read", path = "out" },
    # ProtocolRegistry pin-verification test hashes the committed proving artifacts (M7 P3).
    { access = "read", path = "../circuits/build" },
    { access = "read-write", path = "deployments" },
]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "poseidon-solidity/=lib/poseidon-solidity/",
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
roax = "${ROAX_RPC}"

# ---------------------------------------------------------------------------------------------
# S-12 cutover rehearsal — NETWORK-DEPENDENT, deliberately outside the default suite.
#
# `test = "rehearsal"` rather than adding a directory to the default profile, because these tests
# fork the live chain: folding them into `forge test` would make the hermetic contracts gate depend
# on an endpoint being up. They are OPERATOR-INVOKED through `make rehearse-cutover`, which checks
# the preconditions in the SHELL where a failure is a real non-zero exit — the same split, and for
# the same reason, as `make test-consent-parity`.
#
# They do NOT self-skip on a missing endpoint. `setUp` reads ROAX_FORK_RPC with no default, so an
# absent endpoint is a loud failure rather than a green run that never happened.
# ---------------------------------------------------------------------------------------------
[profile.rehearsal]
src = "src"
out = "out"
libs = ["lib"]
test = "rehearsal"
script = "script"
solc = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "test/consent-fixture.json" },
    { access = "read", path = "deployments/roax.json" },
    { access = "read", path = "rehearsal/fixtures" },
]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "poseidon-solidity/=lib/poseidon-solidity/",
]
