# Dogtag policy starts every new run with --skip=document until no-mistakes has
# an enforced step/file budget. These trusted controls are defense-in-depth for
# accidental raw runs and take effect only after this file reaches the default branch.
agent: claude
allow_repo_commands: false

# Keep project settings enabled so the repository's AGENTS.md constrains gate agents.
disable_project_settings: false

commands:
  # Check-only tools: no formatter writes, generators, codegen, or binding sync.
  # ensure-ts-prereqs.sh runs before the tsc invocations because @dogtag/ui resolves
  # @dogtag/standard's types from the SDK's gitignored dist/: on the pipeline's fresh
  # per-run worktree the checks below cannot run at all until dependencies are installed
  # and the SDK is built. It satisfies that itself, and when it cannot it fails with a
  # cause-specific next step and an explicit statement that nothing ran, instead of a
  # `Command "tsc" not found` that reads like a flaky code finding. It calls a branch
  # defect a code finding and reserves the environment label for a missing toolchain or a
  # proven network/store fault, so neither mistake can be made from its output.
  # The checks themselves are unchanged; the prerequisites cost ~1.3s on a warm
  # tree and ~6.1s on a cold one. The document guard stays first: it needs no
  # node_modules and should fail closed on a dirty worktree before any install runs.
  lint: >-
    bash scripts/check-no-mistakes-document-guard.sh &&
    bash scripts/ensure-ts-prereqs.sh --sdk-dist &&
    pnpm --filter @dogtag/standard exec tsc -p tsconfig.json --noEmit &&
    pnpm --filter @dogtag/ui typecheck
  # A bounded baseline, not the full Cargo/Foundry/circuit/mobile/e2e suite.
  # With user intent, v1.40.0 still launches the test evidence agent as well.
  # Same cold-worktree trap, same remedy: without the prerequisites vitest is not installed
  # and the step fails with `vitest: command not found` / ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL.
  # No --sdk-dist here, because these tests import the SDK source rather than its built dist/.
  test: >-
    bash scripts/test-no-mistakes-document-guard.sh &&
    bash scripts/test-ensure-ts-prereqs.sh &&
    bash scripts/ensure-ts-prereqs.sh &&
    pnpm --filter @dogtag/standard test

document:
  instructions: |
    Update only documentation made stale directly by the submitted branch.
    Never run write-mode formatters, generators, codegen, or UniFFI/binding synchronization.
    Never modify functional source, tests, workflows, circuits, contracts, or generated bindings during Document.
    If resolving documentation would require more than 10 files, any non-documentation file, or cross-slice reconciliation, make no such edits and return an ask-user finding instead.

# Zero disables follow-up fix loops. In v1.40.0 the initial Document agent may
# still make fixes in an accidental raw run, so these prompt constraints and the
# post-stage commit guard remain defense-in-depth, not a runtime cap.
auto_fix:
  review: 0
  document: 0
  lint: 0

# The lint guard identifies Document commits by this exact v1.40.0 expansion:
# "no-mistakes(document): <summary>".
commit:
  fix_message: "no-mistakes({{.Step}}): {{.Summary}}"
